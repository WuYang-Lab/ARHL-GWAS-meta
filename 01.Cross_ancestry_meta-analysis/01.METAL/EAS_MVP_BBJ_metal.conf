# METAL Options:
SCHEME STDERR
AVERAGEFREQ ON
MINMAXFREQ ON
VERBOSE OFF
# Input columns:
CHROMOSOME CHR
MARKER SNP
ALLELE A1 A2
EFFECT beta
STDERR SE
FREQ freq
PVALUE p
WEIGHT N
GENOMICCONTROL OFF

ADDFILTER freq > 0.01
ADDFILTER freq < 0.99
TRACKPOSITIONS ON 
CHROMOSOME CHR
POSITION POS
# additional options
EFFECT_PRINT_PRECISION 12
STDERR_PRINT_PRECISION 12
CUSTOMVARIABLE TotalSampleSize  
LABEL TotalSampleSize as N
PROCESS /public/share/wchirdzhq2022/Wulab_share/GWAS-summary/BBJ/hearing-loss/BBJ_EAS_reformat.gz
PROCESS /public/share/wchirdzhq2022/Wulab_share/GWAS-summary/MVP/hearing-loss/MVP_EAS_reformat.gz

OUTFILE EAS_MVP_BBJ .tbl
ANALYZE HETEROGENEITY 
QUIT

